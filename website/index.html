<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Career DNA – Student Assessment</title>
    <style>
        body {font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;margin:0;padding:0;}
        .container {max-width:720px;margin:auto;background:#fff;padding:20px;
                    border-radius:8px;box-shadow:0 0 12px rgba(0,0,0,.1);}
        h1 {color:#2c3e50;margin-bottom:1rem;}
        label {display:block;margin-top:12px;}
        input, select, textarea {width:100%;padding:8px;margin-top:5px;
                border:1px solid #ccc;border-radius:4px;}
        button {margin-top:16px;padding:10px 20px;background:#2980b9;
                color:#fff;border:none;border-radius:4px;cursor:pointer;}
        button:hover {background:#1c5980;}
        #questionsContainer {margin-top:20px;}
        .question {margin-bottom:18px;}
        #outputJson {background:#f0f0f0;padding:10px;margin-top:20px;
                    white-space:pre-wrap;word-break:break-all;}
    </style>
</head>
<body>
<div class="container">
    <h1>Career DNA – Student Assessment</h1>

    <!-- ==== FORM ==== -->
    <form id="studentForm">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required placeholder="Your full name">

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">

        <label for="mobileNumber">Mobile Number</label>
        <input type="tel" id="mobileNumber" required placeholder="9876543210">

        <label for="grade">Grade</label>
        <select id="grade" required>
            <option value="">Select Grade</option>
            <option>9</option><option>10</option><option>11</option><option>12</option>
        </select>

        <button type="submit">Generate Analysis</button>
    </form>

    <!-- ==== DYNAMIC QUESTIONS WILL BE INSERTED HERE ==== -->
    <div id="questionsContainer"></div>

    <h2>Submitted Data (JSON)</h2>
    <pre id="outputJson">-- JSON will appear here --</pre>
</div>

<!-- Load the script that contains the embedded questionnaire -->
<script src="script.js"></script>
</body>
</html>
