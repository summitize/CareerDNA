<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerDNA — Career Discovery Assessment</title>
  <link rel="icon" type="image/png" href="/public/careerdna-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-inner">
        <a class="logo" href="/" aria-label="CareerDNA home"><img src="/public/careerdna-icon.png" alt="" />CareerDNA</a>
        <div class="header-right">
          <span id="progress-label" class="progress-label hidden"></span>
          <div id="user-menu" class="user-menu hidden"></div>
        </div>
      </div>
      <div id="progress-bar" class="progress-bar hidden">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </header>

    <main id="main" class="main"></main>
    <footer class="site-footer">
      <span>&copy; 2026 Summitize. All rights reserved. &middot; <a href="#" id="contact-btn" class="footer-link">Contact Us</a> &middot; <a href="#" id="whatsnew-btn" class="footer-link">What's New</a></span>
      <div class="theme-slider-container" title="Slide to change theme">
        <span class="theme-slider-label" id="theme-slider-label">Light</span>
        <div class="theme-slider-track-wrapper">
          <span class="theme-slider-icon left-icon">☀️</span>
          <input type="range" id="theme-slider" class="theme-slider" min="0" max="7" step="1" value="0" aria-label="Select color theme (Day, Sunset, Light Pink, Light Blue, Neon, Emerald, Sapphire, Night)" />
          <span class="theme-slider-icon right-icon">🌙</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
