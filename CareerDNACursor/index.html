<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerDNA — Career Discovery Assessment</title>
  <link rel="icon" type="image/png" href="/public/careerdna-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-inner">
        <a class="logo" href="/" aria-label="CareerDNA home"><img src="/public/careerdna-icon.png" alt="" />CareerDNA</a>
        <div class="header-right">
          <span id="progress-label" class="progress-label hidden"></span>
          <button class="header-button" id="contact-btn" type="button">Contact Us</button>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to night mode" title="Switch to night mode"><span aria-hidden="true" class="theme-icon">&#9790;</span></button>
          <div id="user-menu" class="user-menu hidden"></div>
        </div>
      </div>
      <div id="progress-bar" class="progress-bar hidden">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </header>

    <main id="main" class="main"></main>
    <footer class="site-footer">&copy; 2026 Summitize. All rights reserved.</footer>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
